<div class="form-container">
  <h2>{{ isEdit ? 'Edit Medicine' : 'Add Medicine' }}</h2>

  <form [formGroup]="medicineForm" (ngSubmit)="onSubmit()">

    <!-- Name -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Medicine Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter medicine name">
      <mat-error *ngIf="medicineForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <!-- Brand -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Brand</mat-label>
      <input matInput formControlName="brand" placeholder="Enter brand">
      <mat-error *ngIf="medicineForm.get('brand')?.hasError('required')">
        Brand is required
      </mat-error>
    </mat-form-field>

    <!-- Quantity -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" placeholder="Enter stock quantity">
      <mat-error *ngIf="medicineForm.get('quantity')?.hasError('required')">
        Quantity is required
      </mat-error>
    </mat-form-field>

    <!-- Price -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" placeholder="Enter price">
      <mat-error *ngIf="medicineForm.get('price')?.hasError('required')">
        Price is required
      </mat-error>
    </mat-form-field>

    <!-- Buttons -->
    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="medicineForm.invalid">
        {{ isEdit ? 'Update' : 'Save' }}
      </button>
      <button mat-raised-button color="warn" type="button" (click)="onReset()">Reset</button>
    </div>
  </form>
</div>
