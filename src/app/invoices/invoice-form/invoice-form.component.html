<mat-card>
  <mat-card-title>Create Invoice</mat-card-title>
  <mat-card-content>
    <form [formGroup]="invoiceForm" (ngSubmit)="onSubmit()">

      <!-- Customer -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Customer</mat-label>
        <input matInput formControlName="customer" required />
      </mat-form-field>

      <!-- Date -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" required />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <!-- Payment Mode -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Payment Mode</mat-label>
        <mat-select formControlName="paymentMode" required>
          <mat-option value="cash">Cash</mat-option>
          <mat-option value="card">Card</mat-option>
          <mat-option value="upi">UPI</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Dynamic Items -->
      <div formArrayName="items">
        <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="item-row">

          <!-- Medicine -->
          <mat-form-field appearance="outline" class="item-field">
            <mat-label>Medicine</mat-label>
            <mat-select formControlName="medicine" (selectionChange)="updateMedicine(item, $event.value)">
              <mat-option *ngFor="let med of medicines" [value]="med.name">
                {{ med.name }} (₹{{ med.price }})
              </mat-option>
            </mat-select>
          </mat-form-field>

          <!-- Quantity -->
          <mat-form-field appearance="outline" class="item-field">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" formControlName="quantity" (input)="updateQuantity(item)" />
          </mat-form-field>

          <!-- Price -->
          <mat-form-field appearance="outline" class="item-field">
            <mat-label>Price</mat-label>
            <input matInput type="number" formControlName="price" readonly />
          </mat-form-field>

          <!-- Subtotal -->
          <mat-form-field appearance="outline" class="item-field">
            <mat-label>Subtotal</mat-label>
            <input matInput type="number" formControlName="subtotal" readonly />
          </mat-form-field>

          <!-- Remove Button -->
          <button mat-icon-button color="warn" type="button" (click)="removeItem(i)">
            <mat-icon>delete</mat-icon>
          </button>

        </div>
      </div>

      <!-- Add Item Button -->
      <button mat-stroked-button color="primary" type="button" (click)="addItem()">
        <mat-icon>add</mat-icon> Add Item
      </button>

      <!-- Total -->
      <div class="total-box">
        <strong>Total: ₹{{ getTotal() }}</strong>
      </div>

      <!-- Submit -->
      <button mat-raised-button color="primary" type="submit">Save Invoice</button>
    </form>
  </mat-card-content>
</mat-card>
