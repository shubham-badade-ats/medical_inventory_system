<div class="supplier-list">
  <h2>Suppliers</h2>

  <!-- Search & Filter -->
  <div class="filter-bar">
    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search Supplier</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Enter supplier name" />
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onAddSupplier()">
      <mat-icon>add</mat-icon> Add Supplier
    </button>
  </div>

  <!-- Supplier Table -->
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let supplier">{{ supplier.name }}</td>
    </ng-container>

    <!-- Contact Column -->
    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Contact</th>
      <td mat-cell *matCellDef="let supplier">{{ supplier.contact }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let supplier">{{ supplier.email }}</td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let supplier">
        <button mat-icon-button color="accent" (click)="onEditSupplier(supplier)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDeleteSupplier(supplier)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header & Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Pagination -->
  <!-- <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator> -->
</div>
